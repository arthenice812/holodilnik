<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Мой холодильник</title>
<style>
  :root{
    /* светлая палитра (по умолчанию) — тёплая бумага */
    --bg:#EEF0E4; --paper:#F7F7EF; --card:#FFFFFF; --border:#DADFCB;
    --ink:#232A1E; --muted:#6B715C; --muted-soft:#8b9078;
    --fresh:#3F6B3B; --fresh-bg:#E6EEE1;
    --warn:#B8862B; --warn-bg:#F8EBD3;
    --danger:#A8402F; --danger-bg:#F6E3DF;
    --primary:#3F6B3B; --primary-dark:#2F5029; --primary-bg:#F1F5EC;
  }
  :root[data-accent="blue"]{ --primary:#3A5A73; --primary-dark:#28425A; --primary-bg:#E9EEF1; }
  :root[data-accent="pink"]{ --primary:#9C4A5C; --primary-dark:#7A3547; --primary-bg:#F3E7E9; }

  /* тёмная палитра — тёплый тёмный шкаф/полка, а не дефолтный чёрный+неон */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1C1B16; --paper:#211F18; --card:#28261D; --border:#3D3B2C;
      --ink:#EDE8D9; --muted:#A6A18C; --muted-soft:#7d795f;
      --fresh:#8BCB80; --fresh-bg:#233420;
      --warn:#E3B564; --warn-bg:#3A2E15;
      --danger:#E58575; --danger-bg:#3B211C;
      --primary:#77B26D; --primary-dark:#5C9153; --primary-bg:#263420;
    }
    :root:not([data-theme="light"])[data-accent="blue"]{ --primary:#7EACC9; --primary-dark:#5F8CAA; --primary-bg:#20303A; }
    :root:not([data-theme="light"])[data-accent="pink"]{ --primary:#D68CA0; --primary-dark:#B76E84; --primary-bg:#372430; }
  }
  :root[data-theme="dark"]{
    --bg:#1C1B16; --paper:#211F18; --card:#28261D; --border:#3D3B2C;
    --ink:#EDE8D9; --muted:#A6A18C; --muted-soft:#7d795f;
    --fresh:#8BCB80; --fresh-bg:#233420;
    --warn:#E3B564; --warn-bg:#3A2E15;
    --danger:#E58575; --danger-bg:#3B211C;
    --primary:#77B26D; --primary-dark:#5C9153; --primary-bg:#263420;
  }
  :root[data-theme="dark"][data-accent="blue"]{ --primary:#7EACC9; --primary-dark:#5F8CAA; --primary-bg:#20303A; }
  :root[data-theme="dark"][data-accent="pink"]{ --primary:#D68CA0; --primary-dark:#B76E84; --primary-bg:#372430; }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    min-height:100vh; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .display{ font-family:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,serif; }
  .mono{ font-family:'IBM Plex Mono',ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Consolas,monospace; }

  #app{ min-height:100vh; display:flex; flex-direction:column; padding-bottom:78px; max-width:520px; margin:0 auto; position:relative; }
  header.topbar{ display:flex; align-items:center; justify-content:space-between; padding:18px 16px 8px; gap:10px; }
  .brand{ display:flex; align-items:center; gap:8px; min-width:0; }
  .brand h1{ font-size:20px; font-weight:600; margin:0; letter-spacing:-0.01em; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .date-tag{ font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; }
  .icon-btn{ width:34px; height:34px; border-radius:10px; border:1px solid var(--border); background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); flex-shrink:0; }
  .icon-btn:active{ transform:scale(0.96); }
  main{ flex:1; padding:0 14px 90px; }

  .section-label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:16px 4px 8px; font-weight:600; }
  .empty{ text-align:center; color:var(--muted); font-size:13.5px; padding:40px 20px; line-height:1.6; }

  .card{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 14px; display:flex; align-items:center; margin-bottom:8px; gap:10px; }
  .card.clickable{ cursor:pointer; }
  .card.urgent{ order:-1; box-shadow:0 0 0 1.5px var(--danger-tag,var(--warn)); }
  .card-title{ font-size:14.5px; font-weight:600; }
  .card-meta{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .tag{ font-size:10.5px; padding:5px 8px; border-radius:8px; border:1px solid; white-space:nowrap; transform:rotate(-2deg); font-weight:700; text-transform:uppercase; flex-shrink:0; }
  .round-btn{ width:28px; height:28px; border-radius:20px; border:1px solid var(--border); background:var(--paper); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); flex-shrink:0; }
  .checkbox{ width:20px; height:20px; border-radius:6px; border:1.5px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--card); }
  .checkbox.checked{ background:var(--primary); border-color:var(--primary); }

  .fab{ position:fixed; bottom:88px; width:52px; height:52px; border-radius:30px; background:var(--primary); border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(0,0,0,0.25); cursor:pointer; z-index:20; color:#fff; left:50%; transform:translateX(180px); }
  @media (max-width:560px){ .fab{ right:20px; left:auto; transform:none; } }

  .sheet-overlay{ position:fixed; inset:0; background:rgba(20,22,14,0.32); z-index:29; }
  .sheet{ position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:520px; background:var(--paper); border-radius:20px 20px 0 0; padding:16px 18px calc(20px + env(safe-area-inset-bottom)); box-shadow:0 -8px 30px rgba(0,0,0,0.2); z-index:30; max-height:86vh; overflow-y:auto; }
  .sheet-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; position:sticky; top:0; background:var(--paper); }
  .sheet-title{ font-size:17px; font-weight:600; }
  input.f, select.f, textarea.f{ width:100%; box-sizing:border-box; border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:14px; margin-bottom:10px; font-family:inherit; background:#FBFBF6; color:var(--ink); }
  textarea.f{ resize:vertical; }
  .f-label{ font-size:11px; color:var(--muted); text-transform:uppercase; margin-bottom:6px; display:block; font-weight:600; letter-spacing:.03em; }
  .row-gap{ display:flex; gap:8px; }
  .flex1{ flex:1; min-width:0; }
  .link-row{ display:flex; align-items:center; gap:4px; background:none; border:none; color:var(--primary); font-size:12.5px; padding:4px 0 12px; cursor:pointer; font-weight:600; }
  .btn-primary{ width:100%; background:var(--primary); color:#fff; border:none; border-radius:10px; padding:12px 0; font-size:14px; font-weight:700; cursor:pointer; }
  .btn-primary:active{ background:var(--primary-dark); }
  .btn-secondary{ width:100%; background:transparent; color:var(--primary); border:1.5px solid var(--primary); border-radius:10px; padding:10px 0; font-size:13.5px; font-weight:700; cursor:pointer; margin-bottom:8px; }
  .btn-ghost{ background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; padding:8px 0; }

  nav.tabbar{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px; background:var(--card); border-top:1px solid var(--border); display:flex; padding:8px 0 calc(10px + env(safe-area-inset-bottom)); z-index:10; }
  .nav-btn{ flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; cursor:pointer; gap:2px; color:var(--muted); position:relative; }
  .nav-btn.active{ color:var(--primary); }
  .nav-badge{ position:absolute; top:-6px; right:calc(50% - 18px); background:var(--danger); color:#fff; font-size:9px; border-radius:8px; min-width:15px; height:15px; display:flex; align-items:center; justify-content:center; padding:0 3px; }
  .nav-label{ font-size:10px; }

  .chips-row{ display:flex; gap:8px; overflow-x:auto; padding:10px 2px 4px; scrollbar-width:none; }
  .chips-row::-webkit-scrollbar{ display:none; }
  .chip{ font-size:12px; padding:6px 12px; border-radius:20px; border:1px solid var(--border); background:var(--card); color:var(--muted); white-space:nowrap; cursor:pointer; flex-shrink:0; }
  .chip.active{ background:var(--primary); color:#fff; border-color:var(--primary); }

  .segment-row{ display:flex; gap:6px; margin:10px 2px 14px; }
  .segment{ flex:1; display:flex; align-items:center; justify-content:center; gap:4px; padding:9px 2px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--muted); font-size:11.5px; font-weight:700; cursor:pointer; line-height:1.2; text-align:center; }
  .segment svg{ flex-shrink:0; }
  .segment.active{ background:var(--primary); color:#fff; border-color:var(--primary); }

  .recipe-card{ background:var(--card); border:1px solid var(--border); border-radius:14px; margin-bottom:10px; overflow:hidden; }
  .recipe-top{ display:flex; align-items:center; padding:12px 14px; cursor:pointer; gap:10px; }
  .recipe-body{ padding:0 14px 16px; border-top:1px solid var(--border); }
  .macro-row{ display:flex; gap:8px; margin:12px 0; flex-wrap:wrap; }
  .macro-pill{ font-size:12px; background:var(--primary-bg); color:var(--primary-dark); padding:4px 9px; border-radius:8px; }
  .ing-row{ display:flex; align-items:center; padding:4px 0; font-size:13.5px; gap:4px; }
  .dot{ width:8px; height:8px; border-radius:8px; flex-shrink:0; }
  .steps{ font-size:13px; line-height:1.55; margin:6px 0; white-space:pre-wrap; }
  .stamp{ font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--primary); border:1.5px solid var(--primary); border-radius:8px; padding:5px 8px; transform:rotate(-2deg); white-space:nowrap; font-weight:700; flex-shrink:0; }
  .stamp-muted{ font-size:10px; color:var(--muted); border:1px solid var(--border); border-radius:8px; padding:5px 8px; white-space:nowrap; font-weight:700; flex-shrink:0; }

  .week-nav{ display:flex; align-items:center; justify-content:space-between; padding:10px 4px 14px; }
  .week-btn{ width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--card); cursor:pointer; font-size:14px; }
  .day-block{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:10px 14px; margin-bottom:8px; }
  .day-label{ font-size:11px; color:var(--muted); text-transform:uppercase; margin-bottom:8px; letter-spacing:.05em; font-weight:700; }
  .slot-row{ display:flex; align-items:center; margin-bottom:6px; gap:8px; }
  .slot-label{ width:62px; font-size:12.5px; color:var(--muted); flex-shrink:0; }
  .hint{ font-size:12.5px; color:var(--muted); line-height:1.5; margin:6px 4px 14px; }

  .settings-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 4px; border-bottom:1px solid var(--border); cursor:pointer; }
  .settings-row:last-child{ border-bottom:none; }
  .settings-row-label{ font-size:14px; font-weight:600; }
  .settings-row-sub{ font-size:12px; color:var(--muted); margin-top:2px; }
  .chevron-r{ color:var(--muted); flex-shrink:0; }

  .shelf-row{ display:flex; align-items:center; gap:6px; margin-bottom:8px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:6px 8px; }
  .shelf-row input{ border:none; background:transparent; font-size:14px; flex:1; min-width:0; padding:6px 4px; color:var(--ink); }
  .shelf-row input:focus{ outline:none; }
  .tiny-btn{ width:26px; height:26px; border-radius:8px; border:1px solid var(--border); background:var(--paper); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); flex-shrink:0; }
  .tiny-btn:disabled{ opacity:.35; cursor:default; }

  .swatch-row{ display:flex; gap:10px; padding:6px 2px 4px; }
  .swatch{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px; border-radius:12px; border:2px solid var(--border); background:var(--card); cursor:pointer; }
  .swatch.active{ border-color:var(--pswatch); }
  .swatch-dot{ width:26px; height:26px; border-radius:50%; }
  .swatch-name{ font-size:11.5px; font-weight:600; color:var(--ink); }

  .modal-overlay{ position:fixed; inset:0; background:rgba(20,22,14,0.4); z-index:39; display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:560px){ .modal-overlay{ align-items:center; } }
  .modal{ background:var(--paper); width:100%; max-width:520px; max-height:88vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom)); box-shadow:0 -8px 30px rgba(0,0,0,0.25); }
  @media (min-width:560px){ .modal{ border-radius:18px; max-height:80vh; } }
  .modal h2{ margin:0 0 4px; font-size:19px; font-weight:700; }
  .guide-block{ margin:16px 0; }
  .guide-block h3{ font-size:14px; margin:0 0 4px; color:var(--primary-dark); }
  .guide-block p{ font-size:13px; line-height:1.6; color:var(--ink); margin:0; }
  .badge-strip{ display:flex; gap:6px; margin:2px 0 14px; flex-wrap:wrap; }
  .jar-tag{ display:inline-flex; align-items:center; font-size:10px; padding:3px 7px; border-radius:6px; font-weight:700; text-transform:uppercase; }

  .backup-box{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px; font-size:11.5px; margin-bottom:10px; }
  .toast{ position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:#232A1E; color:#F5F3EA; font-size:13px; padding:10px 16px; border-radius:10px; z-index:60; box-shadow:0 6px 20px rgba(0,0,0,.3); max-width:88%; text-align:center; }

  svg.ic{ display:block; }
</style>
</head>

const SEED_RECIPES = [

,
{"id":"b2","name":"Сырники","category":"Завтрак","kcal100":241,"protein":10,"fat":8,"carbs":27,"time":"20 мин","servings":2,"shelfDays":3,"steps":"Творог разминаем вилкой, добавляем яичный желток, мёд и муку, перемешиваем до однородной консистенции. Формируем сырники и обжариваем на растительном масле до золотистой корочки. Поливаем мёдом и подаём с греческим йогуртом.","ingredients":[{"name":"творог 5%","qty":120,"unit":"г"},{"name":"мёд","qty":15,"unit":"г"},{"name":"мука пшеничная","qty":50,"unit":"г"},{"name":"яичный желток","qty":1,"unit":"шт"},{"name":"греческий йогурт 2%","qty":20,"unit":"г"},{"name":"масло растительное","qty":10,"unit":"г"}]}
,

/* ================= helpers ================= */

const uid = () => Math.random().toString(36).slice(2,10);
// Calendar-date <-> string helpers that stay in LOCAL time throughout (never round-trip through
// toISOString/UTC), so a date typed as "24 августа" doesn't silently become the 23rd for users
// east of UTC (or the 25th west of it).
function parseISODate(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function toISODate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
const todayISO = () => toISODate(new Date());
const addDays = (n, from) => { const d = from ? parseISODate(from) : new Date(); d.setDate(d.getDate()+n); return toISODate(d); };
const daysUntil = (iso) => {
  if(!iso) return null;
  const target = parseISODate(iso); const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((target-now)/86400000);
};
const norm = (s) => (s||"").trim().toLowerCase();
const isWeight = (u) => u==="г"||u==="кг"||u==="мл"||u==="л";
const itemKcal = (item) => { if(!item.kcal100) return null; return isWeight(item.unit) ? Math.round(item.kcal100*item.qty/100) : Math.round(item.kcal100*item.qty); };
const esc = (s) => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Resizes+recompresses a picked photo client-side before it goes into localStorage, which has a small quota shared by all app data.
function compressImageFile(file, maxSize, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxSize/Math.max(img.width, img.height));
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function weekStart(dateStr){ const d = parseISODate(dateStr); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return toISODate(d); }
function weekDates(startIso){ return Array.from({length:7},(_,i)=>addDays(i,startIso)); }

function expiryTone(d){
  if(d===null) return {bg:"var(--card)", fg:"var(--muted)"};
  if(d<0) return {bg:"var(--danger-bg)", fg:"var(--danger)"};
  if(d<=2) return {bg:"var(--warn-bg)", fg:"var(--warn)"};
  return {bg:"var(--fresh-bg)", fg:"var(--fresh)"};
}
function expiryLabel(d){
  if(d===null) return "срок не указан";
  if(d<0) return "просрочено";
  if(d===0) return "съесть сегодня";
  return `ещё ${d} дн`;
}

/* ================= state ================= */

let state = null;
let ui = { tab:"fridge", loc:"fridge", sheet:null, recipeOpen:null, recipeCat:"Все", recipeSort:"ready", weekStart: weekStart(todayISO()), settingsView:null, toast:null };

function defaultState(){
  return {
    items: [],
    recipes: [...SEED_RECIPES, ...BOOK_RECIPES].map(r => ({...r})),
    shopping: [],
    plan: {},
    shelves: { fridge:[...DEFAULT_SHELVES.fridge], freezer:[...DEFAULT_SHELVES.freezer], snacks:[...DEFAULT_SHELVES.snacks] },
    productFacts: {},
    settings: { accent:"green", mode:"system", seenIntro:false },
  };
}
// Accepts the old single flat shelf list (pre-multi-location) as well as the current per-location shape.
function normalizeShelves(raw){
  const base = { fridge:[...DEFAULT_SHELVES.fridge], freezer:[...DEFAULT_SHELVES.freezer], snacks:[...DEFAULT_SHELVES.snacks] };
  if(Array.isArray(raw) && raw.length) return { ...base, fridge: raw };
  if(raw && typeof raw==="object"){
    LOCATIONS.forEach(l => { if(Array.isArray(raw[l.id]) && raw[l.id].length) base[l.id] = raw[l.id]; });
  }
  return base;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return { data:defaultState(), isFirstRun:true };
    const parsed = JSON.parse(raw);
    const s = defaultState();
    if(Array.isArray(parsed.items)) s.items = parsed.items;
    if(Array.isArray(parsed.recipes)) s.recipes = parsed.recipes;
    if(Array.isArray(parsed.shopping)) s.shopping = parsed.shopping;
    if(parsed.plan && typeof parsed.plan === "object") s.plan = parsed.plan;
    if(parsed.shelves) s.shelves = normalizeShelves(parsed.shelves);
    if(parsed.productFacts && typeof parsed.productFacts === "object") s.productFacts = parsed.productFacts;
    if(parsed.settings) s.settings = { ...s.settings, ...parsed.settings };
    state = s; // recordProductFacts below reads the module-level `state`
    s.items.forEach(recordProductFacts); // backfill facts from items saved before this feature existed
    return { data:s, isFirstRun:false };
  }catch(e){
    return { data:defaultState(), isFirstRun:true };
  }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

/* ================= domain logic ================= */

function findMatch(ingName){
  return state.items.find(i => norm(i.name)===norm(ingName) || norm(i.name).includes(norm(ingName)) || norm(ingName).includes(norm(i.name)));
}

// Remembers price/store/nutrition per product name, independent of whether the item is still in stock —
// this is what makes "last bought for X" and "real recipe calories" work even after a product runs out.
function recordProductFacts(item){
  if(!item || !item.name || item.type==="dish") return;
  const hasNutrition = item.kcal100!=null || item.protein100!=null || item.fat100!=null || item.carbs100!=null;
  const hasPrice = item.price!=null;
  if(!hasNutrition && !hasPrice && !item.store) return;
  const key = norm(item.name);
  const existing = state.productFacts[key] || {};
  state.productFacts[key] = {
    name: item.name, unit: item.unit,
    kcal100: item.kcal100 ?? existing.kcal100 ?? null,
    protein100: item.protein100 ?? existing.protein100 ?? null,
    fat100: item.fat100 ?? existing.fat100 ?? null,
    carbs100: item.carbs100 ?? existing.carbs100 ?? null,
    price: item.price ?? existing.price ?? null,
    store: item.store ?? existing.store ?? null,
    updatedAt: Date.now(),
  };
}
function lookupProductFacts(name){
  const n = norm(name);
  if(state.productFacts[n]) return state.productFacts[n];
  return Object.values(state.productFacts).find(f => norm(f.name).includes(n) || n.includes(norm(f.name))) || null;
}
function knownStores(){
  return [...new Set(Object.values(state.productFacts).map(f=>f.store).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ru"));
}

function recipeRealNutrition(recipe){
  let kcal=0, protein=0, fat=0, carbs=0, matched=0;
  const missing = [];
  recipe.ingredients.forEach(ing => {
    const facts = lookupProductFacts(ing.name);
    if(!facts || facts.kcal100==null || facts.unit!==ing.unit){ missing.push(ing.name); return; }
    const mult = isWeight(ing.unit) ? ing.qty/100 : ing.qty;
    kcal += facts.kcal100*mult;
    if(facts.protein100!=null) protein += facts.protein100*mult;
    if(facts.fat100!=null) fat += facts.fat100*mult;
    if(facts.carbs100!=null) carbs += facts.carbs100*mult;
    matched++;
  });
  if(matched===0) return null;
  const servings = recipe.servings||1;
  return {
    matched, total: recipe.ingredients.length, missing,
    kcalPerServing: Math.round(kcal/servings), proteinPerServing: Math.round(protein/servings),
    fatPerServing: Math.round(fat/servings), carbsPerServing: Math.round(carbs/servings),
  };
}
function recipeStatus(recipe){
  const details = recipe.ingredients.map(ing => {
    const match = findMatch(ing.name);
    if(!match) return {...ing, status:"missing", have:0};
    if(match.unit === ing.unit) return {...ing, status: match.qty>=ing.qty ? "ok" : "low", have:match.qty};
    return {...ing, status:"ok", have:match.qty};
  });
  const ok = details.filter(d=>d.status==="ok").length;
  return { details, ok, total:details.length, ready: ok===details.length && details.length>0 };
}
// Candidate real fridge items for a recipe ingredient — same fuzzy name match as everywhere else, stock only (not dishes).
function candidateItemsFor(ingName){
  return state.items.filter(i => i.type!=="dish" && (norm(i.name)===norm(ingName) || norm(i.name).includes(norm(ingName)) || norm(ingName).includes(norm(i.name))));
}
function buildCookForm(recipeId){
  const recipe = state.recipes.find(r=>r.id===recipeId);
  if(!recipe) return null;
  return {
    recipeId,
    servings: recipe.servings || 1,
    rows: recipe.ingredients.map(ing => {
      const candidates = candidateItemsFor(ing.name);
      const best = candidates[0] || null;
      return {
        name: ing.name,
        selectedItemId: best ? best.id : "",
        qty: (best && best.unit===ing.unit) ? ing.qty : "",
      };
    }),
  };
}
function openCookSheet(recipeId){
  const form = buildCookForm(recipeId);
  if(!form) return;
  ui.sheet = "cook-recipe";
  ui.cookForm = form;
  render();
}
// Reads the live cook sheet DOM (selected item + qty per row) and computes real totals — used both for
// the live preview while editing and for the actual stock deduction on submit, so what you see is what you get.
function readCookRows(){
  return [...document.querySelectorAll("#cook-rows > .cook-row")].map(rowEl => {
    const itemId = rowEl.querySelector('[data-cook="item"]').value;
    const qty = +rowEl.querySelector('[data-cook="qty"]').value || 0;
    const item = itemId ? state.items.find(i=>i.id===itemId) : null;
    return { item, qty };
  });
}
function computeCookTotals(rows){
  let kcal=0, protein=0, fat=0, carbs=0, counted=0;
  rows.forEach(({item, qty}) => {
    if(!item || !qty || item.kcal100==null) return;
    const mult = isWeight(item.unit) ? qty/100 : qty;
    kcal += item.kcal100*mult;
    if(item.protein100!=null) protein += item.protein100*mult;
    if(item.fat100!=null) fat += item.fat100*mult;
    if(item.carbs100!=null) carbs += item.carbs100*mult;
    counted++;
  });
  return { kcal, protein, fat, carbs, counted, total: rows.length };
}
function submitCook(){
  const recipe = state.recipes.find(r=>r.id===ui.cookForm.recipeId);
  if(!recipe) return;
  const rows = readCookRows();
  const servings = +document.getElementById("cook-servings").value || recipe.servings || 1;
  const t = computeCookTotals(rows);

  rows.forEach(({item, qty}) => {
    if(!item || !qty) return;
    const idx = state.items.findIndex(i=>i.id===item.id);
    if(idx<0) return;
    const newQty = +(state.items[idx].qty - qty).toFixed(1);
    if(newQty<=0) state.items.splice(idx,1); else state.items[idx] = {...state.items[idx], qty:newQty};
  });

  const dish = {
    id:uid(), type:"dish", name:recipe.name, qty:servings, unit:"порции",
    expiry:addDays(recipe.shelfDays||3), location:"fridge", shelf:"Готовая еда",
    kcal100: t.counted ? Math.round(t.kcal/servings) : (recipe.kcal100||null),
    protein100: t.counted ? Math.round(t.protein/servings) : null,
    fat100: t.counted ? Math.round(t.fat/servings) : null,
    carbs100: t.counted ? Math.round(t.carbs/servings) : null,
  };
  state.items.push(dish);
  ui.tab = "fridge"; ui.recipeOpen = null; ui.sheet = null; ui.cookForm = null;
  persistAndRender();
  showToast(t.counted===t.total && t.total>0
    ? `«${recipe.name}» приготовлено — калорийность посчитана по реальным продуктам (${dish.kcal100} ккал/порция)`
    : `«${recipe.name}» приготовлено и списано с полок`);
}
function addMissingToShopping(recipeId){
  const recipe = state.recipes.find(r=>r.id===recipeId);
  if(!recipe) return;
  const status = recipeStatus(recipe);
  const missing = status.details.filter(d=>d.status!=="ok");
  missing.forEach(m => {
    const existing = state.shopping.find(s => norm(s.name)===norm(m.name) && s.unit===m.unit && !s.bought);
    const need = +Math.max(0, m.qty-(m.have||0)).toFixed(1) || m.qty;
    if(existing) existing.qty = +(existing.qty+need).toFixed(1);
    else state.shopping.push({ id:uid(), name:m.name, qty:need, unit:m.unit, bought:false });
  });
  persistAndRender();
  showToast(missing.length ? `Добавлено в список покупок: ${missing.length}` : "Все ингредиенты уже есть в холодильнике");
}
function moveBoughtToFridge(){
  const bought = state.shopping.filter(s=>s.bought);
  if(!bought.length) return;
  const fridgeShelves = state.shelves.fridge;
  const fallbackShelf = fridgeShelves[fridgeShelves.length-1] || "Другое";
  bought.forEach(b => state.items.push({ id:uid(), type:"ingredient", name:b.name, qty:b.qty, unit:b.unit, expiry:addDays(6), location:"fridge", shelf:fallbackShelf }));
  state.shopping = state.shopping.filter(s=>!s.bought);
  persistAndRender();
}
function generateWeekShopping(start){
  const dates = weekDates(start);
  const needed = {};
  dates.forEach(d => {
    const day = state.plan[d]; if(!day) return;
    MEAL_SLOTS.forEach(slot => {
      const rid = day[slot]; if(!rid) return;
      const recipe = state.recipes.find(r=>r.id===rid); if(!recipe) return;
      recipe.ingredients.forEach(ing => {
        const key = norm(ing.name)+"|"+ing.unit;
        needed[key] = needed[key] || { name:ing.name, unit:ing.unit, qty:0 };
        needed[key].qty += ing.qty;
      });
    });
  });
  let added = 0;
  Object.values(needed).forEach(n => {
    const match = findMatch(n.name);
    let remain = n.qty;
    if(match && match.unit===n.unit) remain = Math.max(0, n.qty-match.qty);
    if(remain>0){
      added++;
      const existing = state.shopping.find(s => norm(s.name)===norm(n.name) && s.unit===n.unit && !s.bought);
      if(existing) existing.qty = +(existing.qty+remain).toFixed(1);
      else state.shopping.push({ id:uid(), name:n.name, qty:+remain.toFixed(1), unit:n.unit, bought:false });
    }
  });
  ui.tab = "shopping";
  persistAndRender();
  showToast(added ? `В список покупок добавлено позиций: ${added}` : "Все продукты для меню уже есть в холодильнике");
}

/* ================= render root ================= */

function persistAndRender(){ saveState(); render(); }

function showToast(msg){
  ui.toast = msg;
  render();
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { ui.toast = null; render(); }, 2600);
}

function applyTheme(){
  const html = document.documentElement;
  html.dataset.accent = state.settings.accent;
  if(state.settings.mode==="light") html.dataset.theme = "light";
  else if(state.settings.mode==="dark") html.dataset.theme = "dark";
  else html.removeAttribute("data-theme");
}

function render(){
  applyTheme();
  const root = document.getElementById("app");
  root.innerHTML = `
    ${renderHeader()}
    <main>${renderTab()}</main>
    ${renderNav()}
    ${renderFab()}
    ${ui.sheet ? renderSheet() : ""}
    ${ui.toast ? `<div class="toast">${esc(ui.toast)}</div>` : ""}
  `;
}

function renderHeader(){
  const d = new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"long"});

function renderNav(){

function renderFab(){

  if(done.length){
    html += `<div class="section-label">Куплено</div>`;
    html += done.map(s => `<div class="card clickable" role="button" tabindex="0" style="opacity:.55;" data-action="shopping-toggle" data-id="${s.id}">

  }
  return html;
}

    <button class="btn-primary" data-action="submit-cook">Готово — списать и добавить в холодильник</button>
  </div>`;
}
function recalcCookTotals(){
  const box = document.getElementById("cook-totals");
  const servingsInput = document.getElementById("cook-servings");
  if(!box || !servingsInput) return;
  const rows = readCookRows();
  const t = computeCookTotals(rows);
  const servings = +servingsInput.value || 1;
  if(t.counted===0){
    box.textContent = "Пока не выбрано ни одного продукта с известной калорийностью.";
    return;
  }
  const perServing = Math.round(t.kcal/servings);
  box.textContent = `Известно по ${t.counted} из ${t.total} · всего ≈${Math.round(t.kcal)} ккал · ${perServing} ккал на порцию`;
}

// Rebuilds just the photo row (button/preview/clear) in place — never a full sheet re-render, so

function refreshPhotoRow(){
  const row = document.getElementById("photo-row");
  if(!row) return;
  row.innerHTML = `<input type="file" accept="image/*" id="new-photo" style="display:none;">${renderPhotoRow()}`;

}
function bindPhotoInput(){
  const photoInput = document.getElementById("new-photo");
  if(!photoInput) return;
  photoInput.addEventListener("change", async () => {
    const file = photoInput.files[0];
    if(!file) return;
    try{
      ui.itemForm.photoDataUrl = await compressImageFile(file, 320, 0.62);
      refreshPhotoRow();
    }catch(e){ showToast("Не удалось загрузить фото"); }
  });
}
const SHELF_UNITS = [ { id:"days", label:"дней" }, { id:"weeks", label:"недель" }, { id:"months", label:"месяцев" } ];
function addShelfLife(dateStr, value, unit){
  const d = parseISODate(dateStr||todayISO());
  if(unit==="months") d.setMonth(d.getMonth()+value);
  else if(unit==="weeks") d.setDate(d.getDate()+value*7);
  else d.setDate(d.getDate()+value);
  return toISODate(d);
}
function updateExpiryPreview(){
  const box = document.getElementById("expiry-computed");
  const made = document.getElementById("new-made");
  const valueInput = document.getElementById("new-shelf-value");
  const unitSelect = document.getElementById("new-shelf-unit");
  if(!box || !made || !valueInput || !unitSelect) return;
  const value = +valueInput.value;
  if(!value){ box.textContent = ""; return; }
  const expiry = addShelfLife(made.value, value, unitSelect.value);
  const d = daysUntil(expiry);
  box.textContent = `Годен до ${parseISODate(expiry).toLocaleDateString("ru-RU",{day:"numeric",month:"long"})} — ${expiryLabel(d)}`;
}

      <button class="btn-secondary" data-action="backup-import">${icon("upload",16)} <span style="margin-left:6px;">Восстановить из текста</span></button>
    </div>
    <div id="backup-fallback"></div>
  </div>`;
}

/* ================= dynamic bindings that need real DOM elements ================= */

function bindDynamicInputs(){
  const kcalInput = document.getElementById("new-kcal");
  if(kcalInput){
    const priceHint = document.getElementById("price-hint");
    const nameInput = document.getElementById("new-name");
    const updateHint = () => {
      const nm = nameInput.value.trim();
      if(!nm || !priceHint) return;
      const facts = state.productFacts[norm(nm)];
      if(!facts){ priceHint.textContent = ""; return; }
      const parts = [];
      if(facts.price!=null) parts.push(`в последний раз покупали за ${facts.price}€${facts.store?` в ${facts.store}`:""}`);
      if(facts.kcal100!=null) parts.push(`известна калорийность: ${facts.kcal100} ккал/100${isWeight(facts.unit)?"г/мл":" шт"}`);
      priceHint.textContent = parts.length ? parts.join(" · ") : "";
    };
    nameInput.addEventListener("blur", updateHint);
  }

  bindPhotoInput();

  const restoreFileInput = document.getElementById("restore-file");
  if(restoreFileInput){
    restoreFileInput.addEventListener("change", () => {
      const file = restoreFileInput.files[0];
      if(file) handleRestoreFile(file);
    });
  }

  const shelfValueInput = document.getElementById("new-shelf-value");
  if(shelfValueInput){
    document.getElementById("new-made").addEventListener("input", updateExpiryPreview);
    shelfValueInput.addEventListener("input", updateExpiryPreview);
    document.getElementById("new-shelf-unit").addEventListener("change", updateExpiryPreview);
    updateExpiryPreview();
  }

  const cookRows = document.getElementById("cook-rows");
  if(cookRows){
    cookRows.querySelectorAll('[data-cook="item"]').forEach(sel => {
      sel.addEventListener("change", () => {
        const row = sel.closest(".cook-row");
        const unitSpan = row.querySelector('[data-cook="unit"]');
        const qtyInput = row.querySelector('[data-cook="qty"]');
        const item = sel.value ? state.items.find(i=>i.id===sel.value) : null;
        unitSpan.textContent = item ? item.unit : "";
        if(item && !qtyInput.value){
          const i = +sel.dataset.row;
          const ing = state.recipes.find(r=>r.id===ui.cookForm.recipeId).ingredients[i];
          qtyInput.value = item.unit===ing.unit ? ing.qty : "";
        }
        recalcCookTotals();
      });
    });
    cookRows.querySelectorAll('[data-cook="qty"]').forEach(inp => inp.addEventListener("input", recalcCookTotals));
    const servingsInput = document.getElementById("cook-servings");
    if(servingsInput) servingsInput.addEventListener("input", recalcCookTotals);
    recalcCookTotals();
  }
}

/* ================= event delegation ================= */

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-action]");
  if(!t) return;
  const action = t.dataset.action;

  if(action==="set-tab"){ ui.tab=t.dataset.tab; ui.recipeOpen=null; render(); return; }
  if(action==="set-loc"){ ui.loc=t.dataset.loc; render(); return; }
  if(action==="open-sheet"){ ui.sheet=t.dataset.sheet; if(ui.sheet==='add-item') ui.itemForm={openExtra:false}; if(ui.sheet==='add-recipe') ui.recipeForm={ingCount:1}; render(); return; }
  if(action==="edit-item"){
    const it = state.items.find(i=>i.id===t.dataset.id);
    if(!it) return;
    ui.sheet = "add-item";
    ui.itemForm = { editId: it.id, openExtra: !!(it.brand||it.photo||it.kcal100!=null||it.price!=null), photoDataUrl: it.photo||null };
    render();
    return;
  }
  if(action==="duplicate-item"){
    const it = state.items.find(i=>i.id===t.dataset.id);
    if(!it) return;
    ui.sheet = "add-item";
    ui.itemForm = { duplicateFrom: it.id, openExtra: !!(it.brand||it.photo||it.kcal100!=null||it.price!=null), photoDataUrl: it.photo||null };
    render();
    const nameInput = document.getElementById("new-name");
    if(nameInput){ nameInput.focus(); nameInput.select(); }
    return;
  }
  if(action==="close-sheet"){ ui.sheet=null; render(); return; }
  if(action==="toggle-extra"){
    ui.itemForm.openExtra = !ui.itemForm.openExtra;
    document.getElementById("extra-fields").style.display = ui.itemForm.openExtra ? "block" : "none";
    t.innerHTML = `${icon(ui.itemForm.openExtra?"chevUp":"chevDown",14)} марка, фото, калорийность и цена (необязательно)`;
    return;
  }
  if(action==="qty-step"){
    const input = document.getElementById("new-qty");
    const step = isWeight(document.getElementById("new-unit").value) ? 50 : 1;
    input.value = Math.max(0, (+input.value||0) + step*(+t.dataset.dir));
    return;
  }
  if(action==="pick-photo"){ document.getElementById("new-photo").click(); return; }
  if(action==="clear-photo"){ ui.itemForm.photoDataUrl = null; refreshPhotoRow(); return; }
  if(action==="set-expiry-mode"){
    ui.itemForm.expiryMode = t.dataset.mode;
    document.querySelectorAll('[data-action="set-expiry-mode"]').forEach(b => b.classList.toggle("active", b.dataset.mode===t.dataset.mode));
    document.getElementById("expiry-date-mode").style.display = t.dataset.mode==="date" ? "block" : "none";
    document.getElementById("expiry-shelf-mode").style.display = t.dataset.mode==="shelf" ? "block" : "none";
    if(t.dataset.mode==="shelf") updateExpiryPreview();
    return;
  }

  if(action==="submit-item"){
    const name = document.getElementById("new-name").value.trim();
    const perPieceQty = +document.getElementById("new-qty").value;
    if(!name || !perPieceQty) return;
    const pieceCount = Math.max(1, +document.getElementById("new-pieces").value || 1);
    const qty = +(perPieceQty * pieceCount).toFixed(2);
    const kcalVal = document.getElementById("new-kcal").value;
    const proteinVal = document.getElementById("new-protein").value;
    const fatVal = document.getElementById("new-fat").value;
    const carbsVal = document.getElementById("new-carbs").value;
    const priceVal = document.getElementById("new-price").value;
    const storeVal = document.getElementById("new-store").value.trim();
    const brandVal = document.getElementById("new-brand").value.trim();
    const editId = ui.itemForm.editId;
    let expiry, madeDate=null, shelfLifeValue=null, shelfLifeUnit=null;
    if(ui.itemForm.expiryMode==="shelf"){
      madeDate = document.getElementById("new-made").value;
      shelfLifeValue = +document.getElementById("new-shelf-value").value || null;
      shelfLifeUnit = document.getElementById("new-shelf-unit").value;
      expiry = shelfLifeValue ? addShelfLife(madeDate, shelfLifeValue, shelfLifeUnit) : madeDate;
    }else{
      expiry = document.getElementById("new-expiry").value;
    }
    const fields = {
      name, qty, unit:document.getElementById("new-unit").value,
      pieceQty: pieceCount>1 ? perPieceQty : null, pieceCount: pieceCount>1 ? pieceCount : null,
      expiry, madeDate, shelfLifeValue, shelfLifeUnit, shelf:document.getElementById("new-shelf").value,
      kcal100: kcalVal ? +kcalVal : null, protein100: proteinVal ? +proteinVal : null, fat100: fatVal ? +fatVal : null, carbs100: carbsVal ? +carbsVal : null,
      price: priceVal ? +priceVal : null, store: storeVal || null, brand: brandVal || null, photo: ui.itemForm.photoDataUrl || null,
    };
    let savedItem;
    if(editId){
      const idx = state.items.findIndex(i=>i.id===editId);
      if(idx<0) return;
      savedItem = state.items[idx] = { ...state.items[idx], ...fields };
    }else{
      savedItem = { id:uid(), type:"ingredient", location:ui.loc, ...fields };
      state.items.push(savedItem);
    }
    recordProductFacts(savedItem);
    ui.sheet=null; ui.itemForm=null; persistAndRender(); return;
  }

  if(action==="dish-eat"){ const it=state.items.find(i=>i.id===t.dataset.id); if(it){ it.qty=Math.max(0,+(it.qty-1).toFixed(1)); if(it.qty<=0) state.items=state.items.filter(i=>i.id!==it.id); persistAndRender(); } return; }
  if(action==="item-decrement"){
    const it=state.items.find(i=>i.id===t.dataset.id);
    if(it){
      const step = it.pieceCount ? it.pieceQty : 1;
      it.qty = Math.max(0, +(it.qty-step).toFixed(2));
      if(it.pieceCount) it.pieceCount = Math.max(0, it.pieceCount-1);
      if(it.qty<=0 || it.pieceCount===0) state.items=state.items.filter(i=>i.id!==it.id);
      persistAndRender();
    }
    return;
  }
  if(action==="remove-item"){ state.items = state.items.filter(i=>i.id!==t.dataset.id); persistAndRender(); return; }

  if(action==="set-recipe-cat"){ ui.recipeCat=t.dataset.cat; render(); return; }
  if(action==="set-recipe-sort"){ ui.recipeSort=t.dataset.sort; render(); return; }
  if(action==="toggle-recipe"){ ui.recipeOpen = ui.recipeOpen===t.dataset.id ? null : t.dataset.id; render(); return; }
  if(action==="open-cook"){ openCookSheet(t.dataset.id); return; }
  if(action==="submit-cook"){ submitCook(); return; }
  if(action==="add-missing"){ addMissingToShopping(t.dataset.id); return; }
  if(action==="delete-recipe"){ if(confirm("Удалить этот рецепт?")){ state.recipes = state.recipes.filter(r=>r.id!==t.dataset.id); ui.recipeOpen=null; persistAndRender(); } return; }

  if(action==="add-ing-row"){ ui.recipeForm.ingCount++; document.getElementById("ing-rows").insertAdjacentHTML("beforeend", ingRowHtml()); return; }
  if(action==="submit-recipe"){
    const name = document.getElementById("r-name").value.trim();
    if(!name) return;
    const rows = [...document.querySelectorAll("#ing-rows > div")];
    const ingredients = rows.map(row => ({
      name: row.querySelector('[data-ing="name"]').value.trim(),
      qty: +row.querySelector('[data-ing="qty"]').value || 1,
      unit: row.querySelector('[data-ing="unit"]').value,
    })).filter(i=>i.name);
    state.recipes.push({
      id:uid(), name, category:document.getElementById("r-cat").value, kcal100:+document.getElementById("r-kcal").value||null,
      protein:null, fat:null, carbs:null, time:document.getElementById("r-time").value||"—",
      servings:+document.getElementById("r-servings").value||1, shelfDays:4,
      steps:document.getElementById("r-steps").value, ingredients,
    });
    ui.sheet=null; persistAndRender(); return;
  }

  if(action==="week-shift"){ ui.weekStart = addDays(7*(+t.dataset.dir), ui.weekStart); render(); return; }
  if(action==="generate-week-shopping"){ generateWeekShopping(ui.weekStart); return; }

  if(action==="shopping-add"){
    const name = document.getElementById("shop-name").value.trim(); if(!name) return;
    state.shopping.push({ id:uid(), name, qty:+document.getElementById("shop-qty").value||1, unit:document.getElementById("shop-unit").value, bought:false });
    persistAndRender(); return;
  }
  if(action==="shopping-toggle"){ const s=state.shopping.find(x=>x.id===t.dataset.id); if(s) s.bought=!s.bought; persistAndRender(); return; }
  if(action==="shopping-remove"){ state.shopping = state.shopping.filter(s=>s.id!==t.dataset.id); persistAndRender(); return; }
  if(action==="shopping-move-fridge"){ moveBoughtToFridge(); return; }

  if(action==="open-settings"){ ui.settingsView="root"; render(); return; }
  if(action==="close-settings"){ ui.settingsView=null; render(); return; }
  if(action==="settings-back"){ ui.settingsView="root"; render(); return; }
  if(action==="settings-open"){ ui.settingsView=t.dataset.view; if(t.dataset.view==="shelves") ui.shelvesLoc=ui.loc; render(); return; }
  if(action==="open-instructions"){ ui.settingsView=null; ui.showInstructions=true; render(); return; }
  if(action==="close-instructions"){ ui.showInstructions=false; if(!state.settings.seenIntro){ state.settings.seenIntro=true; saveState(); } render(); return; }

  if(action==="set-shelves-loc"){ ui.shelvesLoc=t.dataset.loc; render(); return; }
  if(action==="shelf-move"){
    const shelves = state.shelves[ui.shelvesLoc];
    const i = +t.dataset.index, dir=+t.dataset.dir, j=i+dir;
    if(j<0||j>=shelves.length) return;
    [shelves[i], shelves[j]] = [shelves[j], shelves[i]];
    saveState(); render(); return;
  }
  if(action==="shelf-delete"){
    const shelves = state.shelves[ui.shelvesLoc];
    if(shelves.length<=1) return;
    const i = +t.dataset.index; const removed = shelves[i];
    shelves.splice(i,1);
    const fallback = shelves[shelves.length-1];
    state.items.forEach(it => { if(it.location===ui.shelvesLoc && it.shelf===removed) it.shelf=fallback; });
    saveState(); render(); return;
  }
  if(action==="shelf-add"){
    const input = document.getElementById("new-shelf-name");
    const val = input.value.trim(); if(!val) return;
    state.shelves[ui.shelvesLoc].push(val); saveState(); render(); return;
  }
  if(action==="set-accent"){ state.settings.accent=t.dataset.accent; saveState(); render(); return; }
  if(action==="set-mode"){ state.settings.mode=t.dataset.mode; saveState(); render(); return; }

  if(action==="backup-export"){ doBackupExport(); return; }
  if(action==="backup-import"){ doBackupImport(); return; }
  if(action==="pick-restore-file"){ document.getElementById("restore-file").click(); return; }
  if(action==="toggle-restore-text"){
    const block = document.getElementById("restore-text-block");
    block.style.display = block.style.display==="none" ? "block" : "none";
    return;
  }
});

document.addEventListener("keydown", (e) => {
  if(e.key!=="Enter" && e.key!==" ") return;
  const t = e.target.closest('[role="button"][data-action]');
  if(!t) return;
  e.preventDefault();
  t.click();
});

document.addEventListener("focusout", (e) => {
  const t = e.target;
  if(t.dataset && t.dataset.actionBlur==="rename-shelf"){
    const shelves = state.shelves[ui.shelvesLoc];
    const i = +t.dataset.shelfIndex;
    const oldName = shelves[i];
    const newName = t.value.trim();
    if(newName && newName!==oldName){
      shelves[i]=newName;
      state.items.forEach(it => { if(it.location===ui.shelvesLoc && it.shelf===oldName) it.shelf=newName; });
      saveState();
    }
  }
});

/* patch render() to also show instructions modal flag + settings overlay after navigation */
const _origRender = render;
render = function(){
  _origRender();
  if(ui.showInstructions){
    const root = document.getElementById("app");
    const extra = document.createElement("div");
    extra.innerHTML = renderInstructionsModal();
    while(extra.firstChild) root.appendChild(extra.firstChild);
  }
  if(ui.settingsView){
    const root = document.getElementById("app");
    const extra = document.createElement("div");
    if(ui.settingsView==="root") extra.innerHTML = renderSettingsSheet();
    else if(ui.settingsView==="shelves") extra.innerHTML = renderShelvesSheet();
    else if(ui.settingsView==="theme") extra.innerHTML = renderThemeSheet();
    else if(ui.settingsView==="backup") extra.innerHTML = renderBackupSheet();
    while(extra.firstChild) root.appendChild(extra.firstChild);
  }
  bindDynamicInputs();
};

/* ================= backup export/import ================= */

async function doBackupExport(){
  const payload = JSON.stringify({ ...state, exportedAt: new Date().toISOString(), app:"moy-holodilnik", version:3 }, null, 2);
  const filename = `moy-holodilnik-backup-${todayISO()}.json`;
  // Inside the Claude artifact viewer, a plain <a download> is inert (sandboxed) — this path handles that case.
  try{
    const downloads = window.claude ? await window.claude.use("downloads") : null;
    if(downloads){
      await downloads.save({ filename, data: payload });
      showToast("Резервная копия сохранена");
      return;
    }
  }catch(err){ /* fall through */ }
  // Normal browser download (GitHub Pages and everywhere outside the Claude viewer) — works without any special API.
  try{
    const blob = new Blob([payload], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    showToast("Резервная копия скачивается");
    return;
  }catch(err){ /* fall through to manual fallback */ }
  const box = document.getElementById("backup-fallback");
  if(box){
    box.innerHTML = `<div class="backup-box"><div class="f-label" style="margin-bottom:6px;">Скачивание недоступно — скопируйте текст вручную:</div><textarea class="f mono" style="min-height:120px;font-size:11px;" onclick="this.select()">${esc(payload)}</textarea></div>`;
  }
}

function restoreFromBackupText(raw){
  raw = (raw||"").trim();
  if(!raw){ showToast("Файл пустой"); return; }
  let parsed;
  try{ parsed = JSON.parse(raw); }catch(e){ showToast("Не удалось прочитать файл — это не резервная копия «Мой холодильник»"); return; }
  if(!parsed || !Array.isArray(parsed.items) || !Array.isArray(parsed.recipes)){
    showToast("Файл не похож на резервную копию «Мой холодильник»"); return;
  }
  if(!confirm("Заменить текущие данные данными из резервной копии? Текущие продукты, рецепты, список покупок и меню будут перезаписаны.")) return;
  state = {
    items: parsed.items||[], recipes: parsed.recipes||[...SEED_RECIPES, ...BOOK_RECIPES].map(r=>({...r})),
    shopping: parsed.shopping||[], plan: parsed.plan||{},
    shelves: normalizeShelves(parsed.shelves),
    productFacts: (parsed.productFacts && typeof parsed.productFacts==="object") ? parsed.productFacts : {},
    settings: { accent: parsed.settings?.accent||"green", mode: parsed.settings?.mode||"system", seenIntro:true },
  };
  ui.settingsView=null; ui.sheet=null;
  persistAndRender();
  showToast("Данные восстановлены из резервной копии");
}
function doBackupImport(){
  restoreFromBackupText(document.getElementById("restore-text").value);
}
function handleRestoreFile(file){
  const reader = new FileReader();
  reader.onload = () => restoreFromBackupText(String(reader.result||""));
  reader.onerror = () => showToast("Не удалось прочитать файл");
  reader.readAsText(file);
}

/* ================= init ================= */

(function init(){
  const { data, isFirstRun } = loadState();
  state = data;
  if(isFirstRun || !state.settings.seenIntro) ui.showInstructions = true;
  render();
})();
</script>
